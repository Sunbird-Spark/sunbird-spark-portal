sonar.projectKey=Sunbird-Spark_sunbird-spark-portal
sonar.organization=sunbird-spark
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8

# Source code (whole repo, so Dockerfile, workflows and configs are analyzed too)
sonar.sources=.

# Identify test files
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.scannerwork/**,**/.git/**

# Coverage exclusions
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.mock.ts,**/*.config.ts,**/*.config.js

# Coverage reports
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
