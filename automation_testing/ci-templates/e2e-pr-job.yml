# ──────────────────────────────────────────────────────────────────────────────
# OPTIONAL: E2E job to add to your pull-requests.yml
#
# To activate, paste the job below into .github/workflows/pull-requests.yml
# under the `jobs:` key — after the existing frontend-checks and backend-checks
# jobs. Then follow the setup steps in automation_testing/README.md
# ──────────────────────────────────────────────────────────────────────────────

  e2e-all:
    name: E2E All Tests (Anonymous + Enrolled)
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    defaults:
      run:
        working-directory: automation_testing/web-portal
    env:
      BASE_URL: ${{ vars.E2E_BASE_URL || 'https://test.sunbirded.org' }}
      REGISTERED_USER_EMAIL: ${{ vars.E2E_REGISTERED_USER_EMAIL || 'user1@yopmail.com' }}
      REGISTERED_USER_PASSWORD: ${{ vars.E2E_REGISTERED_USER_PASSWORD || 'User1@123' }}
      USER2_EMAIL: ${{ vars.E2E_USER2_EMAIL || 'user2@yopmail.com' }}
      USER2_PASSWORD: ${{ vars.E2E_USER2_PASSWORD || 'User2@123' }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run all E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-all-report
          path: automation_testing/web-portal/playwright-report/
          retention-days: 7
