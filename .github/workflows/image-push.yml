name: Portal Build and Push Docker Image

on:
  push:
    tags:
      - '*'

env:
  BUILD_DOCKER_IMAGE: ${{ vars.BUILD_DOCKER_IMAGE || 'true' }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker Image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          IMAGE_NAME="sunbird-portal"
          # Tag format: tagname_commitsha (short)
          COMMIT_HASH=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG=$(echo "${{ github.ref_name }}_${COMMIT_HASH}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated tag: ${IMAGE_TAG}"

          docker build --build-arg COMMIT_HASH=${COMMIT_HASH} -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Login Docker Registry
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        env:
          REGISTRY_PROVIDER: ${{ vars.REGISTRY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
          REGISTRY_URL_INPUT: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          case "$REGISTRY_PROVIDER" in
          "gcp")
            echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 --decode > "$HOME/gcloud-key.json"
            gcloud auth activate-service-account --key-file="$HOME/gcloud-key.json"
            gcloud auth configure-docker "$REGISTRY_NAME"
            REGISTRY_URL=$(echo "$REGISTRY_URL_INPUT" | tr '[:upper:]' '[:lower:]')
            IMAGE_REF="${REGISTRY_URL}/${IMAGE_NAME}"
            ;;
          "azure")
            # Azure ACR: registry host only, image repo handled by IMAGE_NAME
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_NAME" \
              --username "$REGISTRY_USERNAME" --password-stdin
            REGISTRY_URL=$(echo "$REGISTRY_URL_INPUT" | tr '[:upper:]' '[:lower:]')
            IMAGE_REF="${REGISTRY_URL}/${IMAGE_NAME}"
            ;;
          "dockerhub")
            # Docker Hub: login without host and use username/image for IMAGE_NAME
            echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin
            IMAGE_NAME="${REGISTRY_USERNAME}/${IMAGE_NAME}"
            echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
            REGISTRY_URL="docker.io"
            IMAGE_REF="${REGISTRY_URL}/${IMAGE_NAME}"
            ;;
          *)
            # GHCR: repository path already ends in the image name, so push to it directly
            REPO_NAME_LOWERCASE=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            REGISTRY_URL="ghcr.io/$REPO_NAME_LOWERCASE"
            IMAGE_REF="${REGISTRY_URL}"
            ;;
          esac
          echo "REGISTRY_URL=${REGISTRY_URL}" >> $GITHUB_ENV
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV

      - name: Push Docker image
        if: ${{ env.BUILD_DOCKER_IMAGE == 'true' }}
        run: |
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_REF}:${IMAGE_TAG}
          docker push ${IMAGE_REF}:${IMAGE_TAG}
          echo "Docker image pushed successfully: ${IMAGE_REF}:${IMAGE_TAG}"