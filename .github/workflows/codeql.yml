# CodeQL static analysis (SAST) — scans frontend/ and backend/ TypeScript for
# security issues on every push/PR to main, plus a weekly run to catch drift
# from new CodeQL query packs. Results land in Security > Code scanning alerts.
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "v*"
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

# Default to read-only; the job grants only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"
