name: Pull Request Quality Checks

on:
  pull_request:

jobs:
  frontend-checks:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # Regenerate package-lock.json only with the Node version in .nvmrc, which
      # matches the one pinned above and in the Dockerfile. A newer npm places the
      # @emnapi/* packages (via @unrs/resolver-binding-wasm32-wasi) differently in
      # the tree, and `npm ci` in the release image build then rejects the lockfile
      # with "Missing: @emnapi/core@... from lock file" -- even though CI passes.
      # The OS does not matter here; the npm version does.
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node copy-assets.js

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:coverage

  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm run test:coverage
