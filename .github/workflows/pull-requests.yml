name: Pull Request Quality Checks

on:
  pull_request:

jobs:
  frontend-checks:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # NOTE: frontend/package-lock.json must be regenerated on Linux, not macOS.
      # `npm install` on macOS prunes Linux-only optional dependencies (the
      # @emnapi/* packages pulled in by @unrs/resolver-binding-wasm32-wasi), and
      # `npm ci` then fails here with "Missing: @emnapi/core from lock file".
      # To refresh it:
      #   docker run --rm -v "$PWD/frontend:/w" -w /w node:24 \
      #     npm install --ignore-scripts --package-lock-only
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node copy-assets.js

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:coverage

  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm run test:coverage
