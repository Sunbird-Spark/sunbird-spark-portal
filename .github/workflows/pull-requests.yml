name: Pull Request Quality Checks

on:
  pull_request:

jobs:
  frontend-checks:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      # `npm ci` fails if the lockfile was written by a different npm than the one
      # reading it -- npm 11.6.2 and 11.17 disagree on where the @emnapi/* packages
      # (via @unrs/resolver-binding-wasm32-wasi) belong in the tree, giving
      # "Missing: @emnapi/core@... from lock file". This is an npm-version
      # difference, not an OS one: Linux and macOS produce identical lockfiles on
      # the same npm. Use the Node version in .nvmrc locally -- it matches the
      # version pinned above -- and the lockfile will stay stable for everyone.
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node copy-assets.js

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:coverage

  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm run test:coverage
