name: Feature request
description: Suggest a new capability or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The portal is used by many adopters, so features that help most of them land
        more easily than ones serving a single deployment.

        **Agree the approach here before writing significant code.**

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions, and this isn't already suggested
          required: true
        - label: I checked the README — theming, templates and feature flags are configurable, and this isn't already possible that way
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the portal?
      options:
        - Frontend (React / Vite)
        - Backend (Express API)
        - Authentication or access control
        - Theming, fonts or templates
        - Internationalisation or accessibility
        - Content player or editors
        - Developer experience or tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're stuck in, not the solution you have in mind.
      placeholder: When I ... I can't ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: who-benefits
    attributes:
      label: Who benefits from this?
      description: Which adopters, and in what situations. If it's specific to one deployment, say so.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you're using now, or projects that solved this well.

  - type: dropdown
    id: contributing
    attributes:
      label: Would you like to build this?
      options:
        - I'd like to build it myself
        - I'd like guidance before trying
        - I'm only suggesting it
    validations:
      required: true