name: Documentation
description: Something in the docs is wrong, missing, or hard to follow
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation fixes are real contributions and an ideal first one. If the setup
        steps didn't work when you followed them, that's a genuine bug worth reporting here.

  - type: dropdown
    id: location
    attributes:
      label: Where is it?
      options:
        - README — setup or getting started
        - README — theming system
        - README — architecture or project structure
        - CONTRIBUTING.md
        - docs/ folder
        - Code comments or inline docs
        - Spark documentation site
        - Somewhere else
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link or file path
      placeholder: README.md, or https://sunbird.gitbook.io/sunbird-spark/...
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: What's the problem?
      options:
        - It's wrong or out of date
        - Something is missing
        - The steps didn't work when I followed them
        - It's confusing or hard to follow
        - Broken link or formatting
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What needs changing?
      description: What the docs say now, and what they should say instead. If steps failed, include what happened and your Node version and OS.
    validations:
      required: true

  - type: dropdown
    id: contributing
    attributes:
      label: Would you like to fix this?
      options:
        - I'd like to submit the fix myself
        - I'd like guidance before trying
        - I'm only reporting it
    validations:
      required: true